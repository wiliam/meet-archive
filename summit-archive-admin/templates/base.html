<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Summit Archive{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/">
      <span class="brand-mark">⌘</span>
      <span class="brand-name">Summit Archive</span>
    </a>
    {% if show_sync %}
    <nav class="top-nav"><a href="/sync">Синхронизация</a></nav>
    {% endif %}
    <form class="search" action="/" method="get">
      <input type="search" name="q" value="{{ q|default('') }}"
             placeholder="Поиск по транскриптам, темам, названиям…" autocomplete="off">
      <button type="submit">Найти</button>
    </form>
  </header>
  <main class="layout">
    {% block content %}{% endblock %}
  </main>
  <footer class="colophon">Личный архив встреч · только чтение</footer>
</body>
</html>
